<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>نتیجه تراکنش | WebLegend</title>
    
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/misc/Farsi-Digits/font-face.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { 
                        brand: { 
                            gold: '#D4AF37', 
                            primary: '#000000'
                        } 
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen flex items-center justify-center p-4 font-[Vazirmatn]">

    <div class="w-full max-w-md bg-white dark:bg-gray-800 rounded-3xl shadow-2xl overflow-hidden relative">
        <div class="bg-brand-gold h-2"></div>
        
        <div class="p-8 text-center">
            
            <div id="loading" class="flex flex-col items-center justify-center py-10">
                <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-brand-gold mb-4"></div>
                <p class="text-gray-600 dark:text-gray-300 animate-pulse font-bold">در حال ارتباط با بانک...</p>
                <p class="text-xs text-gray-400 mt-2">لطفاً تا دریافت نتیجه نهایی صبر کنید</p>
            </div>

            <div id="content" class="hidden animate-fade-in-up">
                <div id="status-icon" class="mb-4 flex justify-center"></div>
                <h2 id="status-text" class="text-2xl font-black mb-2 text-gray-800 dark:text-white"></h2>
                
                <div id="ref-wrapper" class="hidden">
                    <p class="text-xs text-gray-400 mb-1">شماره مرجع تراکنش:</p>
                    <p id="ref-code" class="text-lg font-mono font-bold text-brand-gold mb-8 bg-gray-50 dark:bg-white/5 py-3 rounded-xl select-all border border-gray-100 dark:border-white/10 tracking-widest"></p>
                </div>
                
                <a id="btn-return" href="index.html" class="hidden inline-flex items-center justify-center w-full py-4 bg-gray-900 hover:bg-black dark:bg-brand-gold dark:hover:bg-yellow-500 dark:text-black text-white rounded-xl transition shadow-lg transform active:scale-95 font-bold">
                    بازگشت به خانه
                </a>
            </div>

        </div>
    </div>

    <script>
        // ============================================================
        // 🔴 تنظیمات پروژه (هماهنگ با سرور شما)
        // ============================================================
        const supabaseUrl = 'https://bclbzdvupfiqihcdjltu.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJjbGJ6ZHZ1cGZpcWloY2RqbHR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY1NjA5NTcsImV4cCI6MjA4MjEzNjk1N30.fiCvS54TEbVZPm_chLcHEo8MAr1AHhP5CKNGbxr02JY';
        
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        async function verifyTransaction() {
            const statusEl = document.getElementById('status-text');
            const iconEl = document.getElementById('status-icon');
            const refEl = document.getElementById('ref-code');
            const refWrapper = document.getElementById('ref-wrapper');
            const loadingEl = document.getElementById('loading');
            const contentEl = document.getElementById('content');
            const btnReturn = document.getElementById('btn-return');

            // 1. دریافت پارامترهای زرین‌پال (Authority, Status)
            const urlParams = new URLSearchParams(window.location.search);
            const authority = urlParams.get('Authority'); 
            const status = urlParams.get('Status');
            
            // پارامترهای داخلی ما (که در create-payment به callbackUrl اضافه کردیم)
            const type = urlParams.get('type') || 'order'; 

            console.log("ZarinPal Verify Params:", { authority, status, type });

            // 2. بررسی اولیه کلاینت
            if (status !== 'OK') {
                showError('پرداخت ناموفق', 'عملیات پرداخت توسط کاربر یا بانک لغو شد.');
                return;
            }

            if (!authority) {
                showError('خطای پارامتر', 'اطلاعات بازگشتی از بانک ناقص است.');
                return;
            }

            try {
                // 3. ارسال به سرور برای تایید نهایی (Verify API)
                const { data, error } = await supabaseClient.functions.invoke('verify-payment', {
                    body: { 
                        authority: authority, 
                        status: status, 
                        type: type 
                    }
                });

                if (error) throw error;

                if (data && data.success) {
                    // ✅ موفقیت آمیز
                    loadingEl.classList.add('hidden');
                    contentEl.classList.remove('hidden');
                    
                    statusEl.textContent = 'پرداخت موفق بود!';
                    statusEl.className = 'text-2xl font-black text-green-600 dark:text-green-400 mt-4';
                    iconEl.innerHTML = '<div class="w-20 h-20 bg-green-100 dark:bg-green-900/30 rounded-full flex items-center justify-center"><i class="fas fa-check text-4xl text-green-500"></i></div>';
                    
                    if (data.refNumber) {
                        refWrapper.classList.remove('hidden');
                        refEl.textContent = data.refNumber;
                    }

                    fireConfetti();

                    // تنظیم هوشمند دکمه بازگشت
                    btnReturn.classList.remove('hidden');
                    
                    if (type === 'subscription') {
                        // اگر اشتراک بود -> برو به داشبورد
                        btnReturn.href = 'dashboard.html';
                        btnReturn.innerHTML = '<i class="fas fa-user-shield mr-2"></i> ورود به پنل مدیریت';
                    } else if (data.sellerId) {
                        // اگر محصول بود -> برو به فروشگاه فروشنده
                        btnReturn.href = `store.html?id=${data.sellerId}`;
                        btnReturn.innerHTML = '<i class="fas fa-store mr-2"></i> بازگشت به فروشگاه';
                    } else {
                        btnReturn.href = 'index.html';
                        btnReturn.innerHTML = 'بازگشت به صفحه اصلی';
                    }

                } else {
                    // خطا از سمت سرور (مثلا تایید نشد یا تکراری بود)
                    throw new Error(data.message || 'تایید تراکنش انجام نشد');
                }

            } catch (err) {
                console.error("Server Verify Error:", err);
                showError('خطا در تایید تراکنش', err.message || 'مشکل در ارتباط با سرور');
            }
        }

        function showError(title, detail) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('content').classList.remove('hidden');
            
            const statusEl = document.getElementById('status-text');
            const refWrapper = document.getElementById('ref-wrapper');
            const iconEl = document.getElementById('status-icon');
            const btn = document.getElementById('btn-return');
            
            statusEl.textContent = title;
            statusEl.className = 'text-xl font-bold text-red-600 mt-4';
            
            // نمایش متن خطا جای کد پیگیری
            refWrapper.classList.remove('hidden');
            document.querySelector('#ref-wrapper p:first-child').textContent = 'علت خطا:';
            document.getElementById('ref-code').textContent = detail;
            document.getElementById('ref-code').className = "text-sm font-bold text-red-500 mb-8 bg-red-50 dark:bg-red-900/20 py-3 rounded-xl border border-red-100 dark:border-red-900/30 px-4";

            iconEl.innerHTML = '<div class="w-20 h-20 bg-red-100 dark:bg-red-900/30 rounded-full flex items-center justify-center animate-pulse"><i class="fas fa-times text-4xl text-red-500"></i></div>';
            
            btn.classList.remove('hidden');
            btn.href = "javascript:history.back()"; 
            btn.innerHTML = '<i class="fas fa-redo mr-2"></i> بازگشت و تلاش مجدد';
        }

        function fireConfetti() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };
            var random = function(min, max) { return Math.random() * (max - min) + min; }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) { return clearInterval(interval); }
                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: random(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: random(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        // شروع خودکار عملیات
        verifyTransaction();
    </script>
</body>
</html>
