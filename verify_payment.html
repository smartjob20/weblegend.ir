<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>نتیجه تراکنش | WebLegend</title>
    
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/misc/Farsi-Digits/font-face.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { 
                        brand: { 
                            gold: '#D4AF37', 
                            primary: '#000000'
                        } 
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen flex items-center justify-center p-4 font-[Vazirmatn]">

    <div class="w-full max-w-md bg-white dark:bg-gray-800 rounded-3xl shadow-2xl overflow-hidden relative">
        <div class="bg-brand-gold h-2"></div>
        
        <div class="p-8 text-center">
            
            <div id="loading" class="flex flex-col items-center justify-center py-10">
                <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-brand-gold mb-4"></div>
                <p class="text-gray-600 dark:text-gray-300 animate-pulse">در حال استعلام وضعیت پرداخت...</p>
                <p class="text-xs text-gray-400 mt-2">لطفاً صفحه را نبندید</p>
            </div>

            <div id="content" class="hidden">
                <div id="status-icon" class="mb-4"></div>
                <h2 id="status-text" class="text-2xl font-bold mb-2"></h2>
                <p id="ref-code" class="text-sm text-gray-500 dark:text-gray-400 mb-8 bg-gray-50 dark:bg-white/5 py-2 rounded-lg"></p>
                
                <a id="btn-return" href="dashboard.html" class="hidden inline-block w-full py-3 bg-gray-800 hover:bg-black text-white rounded-xl transition shadow-lg transform active:scale-95">
                    بازگشت به پنل کاربری
                </a>
            </div>

        </div>
    </div>

    <script>
        // ============================================================
        // ⚡ تنظیمات اتصال به سوپربیس
        // ============================================================
        // مقادیر زیر را با مقادیر پروژه خودتان جایگزین کنید (اگر در فایل‌های دیگر دارید، از آنجا کپی کنید)
        const supabaseUrl = 'https://bclbzdvupfiqihcdjltu.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJjbGJ6ZHZ1cGZpcWloY2RqbHR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY1NjA5NTcsImV4cCI6MjA4MjEzNjk1N30.fiCvS54TEbVZPm_chLcHEo8MAr1AHhP5CKNGbxr02JY'; 
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function verifyTransaction() {
            const statusEl = document.getElementById('status-text');
            const iconEl = document.getElementById('status-icon');
            const refEl = document.getElementById('ref-code');
            const loadingEl = document.getElementById('loading');
            const contentEl = document.getElementById('content');
            const btnReturn = document.getElementById('btn-return');

            // 1. دریافت پارامترها از URL (که بانک فرستاده)
            const urlParams = new URLSearchParams(window.location.search);
            const trackId = urlParams.get('trackId');
            const success = urlParams.get('success');
            const status = urlParams.get('status');
            const orderId = urlParams.get('orderId'); 
            
            // 🔥 نکته حیاتی: دریافت نوع تراکنش که در sale.html و dashboard.html اضافه کردیم
            const type = urlParams.get('type') || 'order'; 

            // 2. بررسی اولیه وضعیت بازگشتی از زیبال
            if (success !== '1') {
                showError(`پرداخت ناموفق بود.`, `کد خطا: ${status}`);
                return;
            }

            try {
                // 3. ارسال درخواست به Edge Function برای تایید نهایی
                // ما پارامتر type را هم می‌فرستیم تا سرور بداند چه چیزی را آپدیت کند
                const { data, error } = await supabase.functions.invoke('verify-payment', {
                    body: { 
                        trackId: trackId,
                        orderId: orderId,
                        type: type 
                    }
                });

                if (error) throw error;

                if (data && data.success) {
                    // ✅ پرداخت موفق
                    loadingEl.classList.add('hidden');
                    contentEl.classList.remove('hidden');
                    
                    statusEl.textContent = 'پرداخت با موفقیت انجام شد';
                    statusEl.className = 'text-xl font-bold text-green-600 mt-4';
                    iconEl.innerHTML = '<i class="fas fa-check-circle text-6xl text-green-500 animate-bounce"></i>';
                    
                    if (data.refNumber) {
                        refEl.innerHTML = `کد پیگیری تراکنش: <span class="font-mono font-bold text-lg select-all">${data.refNumber}</span>`;
                    }

                    fireConfetti(); // جشن و شادی!

                    // تنظیم دکمه بازگشت هوشمند
                    btnReturn.classList.remove('hidden');
                    if (type === 'subscription') {
                        btnReturn.href = 'dashboard.html?tab=profile'; // برگشت به پروفایل برای دیدن تیک آبی
                        btnReturn.textContent = 'مشاهده اشتراک ویژه';
                    } else {
                        btnReturn.href = 'customer.html'; // برگشت به پنل مشتری برای دیدن سفارش
                        btnReturn.textContent = 'پیگیری سفارش';
                    }

                    // هدایت خودکار بعد از ۵ ثانیه
                    setTimeout(() => {
                        window.location.href = btnReturn.href;
                    }, 5000);

                } else {
                    throw new Error(data.message || 'تایید تراکنش توسط سرور انجام نشد');
                }

            } catch (err) {
                console.error(err);
                showError('خطا در تایید نهایی', err.message || 'ارتباط با سرور برقرار نشد');
            }
        }

        function showError(title, detail) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('content').classList.remove('hidden');
            
            const statusEl = document.getElementById('status-text');
            const refEl = document.getElementById('ref-code');
            const iconEl = document.getElementById('status-icon');
            
            statusEl.textContent = title;
            statusEl.className = 'text-xl font-bold text-red-600 mt-4';
            refEl.textContent = detail;
            iconEl.innerHTML = '<i class="fas fa-times-circle text-6xl text-red-500 animate-pulse"></i>';
            
            const btn = document.getElementById('btn-return');
            btn.classList.remove('hidden');
            btn.textContent = 'بازگشت و تلاش مجدد';
        }

        // شروع عملیات به محض لود شدن صفحه
        verifyTransaction();

        // افکت کاغذ رنگی
        function fireConfetti() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };
            var random = function(min, max) { return Math.random() * (max - min) + min; }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) { return clearInterval(interval); }
                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: random(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: random(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }
    </script>
</body>
</html>
