<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>نتیجه تراکنش | Web Legend</title>
    
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <style>
        body { background-color: #f8f9fa; font-family: 'Vazirmatn', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .receipt-card { width: 100%; max-width: 400px; background: #fff; border-radius: 24px; box-shadow: 0 20px 50px -12px rgba(0,0,0,0.1); overflow: hidden; position: relative; }
        .status-header { padding: 40px 20px 60px; text-align: center; position: relative; color: white; clip-path: polygon(0 0, 100% 0, 100% 85%, 50% 100%, 0 85%); }
        .status-header.success { background: linear-gradient(135deg, #10b981, #059669); }
        .status-header.error { background: linear-gradient(135deg, #ef4444, #b91c1c); }
        .status-icon { width: 80px; height: 80px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; backdrop-filter: blur(5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); border: 2px solid rgba(255,255,255,0.4); }
        .status-icon i { font-size: 40px; color: #fff; }
        .receipt-body { padding: 0 25px 30px; margin-top: -40px; position: relative; z-index: 10; }
        .info-box { background: #fff; border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; border: 1px solid #f3f4f6; }
        .amount-display { font-size: 28px; font-weight: 900; color: #1f2937; margin: 10px 0; letter-spacing: -1px; }
        .detail-row { display: flex; justify-content: space-between; font-size: 13px; color: #6b7280; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px dashed #e5e7eb; }
        .detail-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .detail-val { font-weight: 800; color: #111827; }
        .action-btn { width: 100%; padding: 16px; border-radius: 16px; font-weight: 800; margin-top: 15px; cursor: pointer; transition: 0.2s; display: flex; items-center; justify-content: center; gap: 10px; }
        .btn-main { background: #1f2937; color: #fff; box-shadow: 0 10px 20px -5px rgba(31, 41, 55, 0.3); }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 15px 30px -5px rgba(31, 41, 55, 0.4); }
        .btn-sec { background: #f3f4f6; color: #4b5563; }
        .btn-sec:hover { background: #e5e7eb; }
        .loader { border: 3px solid rgba(0,0,0,0.1); border-left-color: #D4AF37; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none !important; }
        
        /* Capture Area for Receipt */
        #capture-area { background: #fff; padding: 0; }
    </style>
</head>
<body>

    <!-- Loading State -->
    <div id="loader-view" class="text-center">
        <div class="loader mb-4"></div>
        <h2 class="font-bold text-gray-700">در حال تایید تراکنش...</h2>
        <p class="text-xs text-gray-400 mt-2">لطفاً چند لحظه صبر کنید</p>
    </div>

    <!-- Main Receipt Card -->
    <div id="result-view" class="receipt-card hidden">
        <div id="capture-area">
            <div id="status-header" class="status-header success">
                <div class="status-icon">
                    <i id="status-icon-i" class="fas fa-check"></i>
                </div>
                <h1 class="text-2xl font-black mb-1" id="status-title">پرداخت موفق</h1>
                <p class="text-xs opacity-90 font-medium" id="status-desc">تراکنش با موفقیت انجام شد</p>
            </div>

            <div class="receipt-body">
                <div class="info-box">
                    <p class="text-xs text-gray-400 font-bold uppercase tracking-widest mb-1">مبلغ پرداختی</p>
                    <div class="amount-display flex justify-center items-center gap-1 dir-ltr">
                        <span id="amount-val">0</span>
                        <span class="text-sm font-bold text-gray-400">تومان</span>
                    </div>
                    
                    <div class="mt-6 text-right">
                        <div class="detail-row">
                            <span>کد پیگیری</span>
                            <span class="detail-val font-mono tracking-wider text-lg" id="ref-id">---</span>
                        </div>
                        <div class="detail-row">
                            <span>تاریخ</span>
                            <span class="detail-val" id="date-val">---</span>
                        </div>
                        <div class="detail-row">
                            <span>بابت</span>
                            <span class="detail-val truncate max-w-[150px]" id="order-type">سفارش</span>
                        </div>
                        <div class="detail-row hidden" id="card-pan-row">
                            <span>شماره کارت</span>
                            <span class="detail-val font-mono" id="card-pan">---</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="p-6 pt-0">
            <button id="btn-success-action" class="action-btn btn-main hidden" onclick="handleSuccessAction()">
                <span>بازگشت به فروشگاه</span> <i class="fas fa-store"></i>
            </button>
            <button id="btn-retry" class="action-btn btn-main hidden" onclick="window.history.back()">
                <span>تلاش مجدد</span> <i class="fas fa-redo"></i>
            </button>
            <button id="btn-download" class="action-btn btn-sec hidden" onclick="downloadReceipt()">
                <span>دانلود رسید</span> <i class="fas fa-download"></i>
            </button>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

        const supabaseUrl = 'https://bclbzdvupfiqihcdjltu.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJjbGJ6ZHZ1cGZpcWloY2RqbHR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY1NjA5NTcsImV4cCI6MjA4MjEzNjk1N30.fiCvS54TEbVZPm_chLcHEo8MAr1AHhP5CKNGbxr02JY';
        const supabase = createClient(supabaseUrl, supabaseKey);

        const urlParams = new URLSearchParams(window.location.search);
        
        // Params from Gateway
        const authority = urlParams.get('Authority') || urlParams.get('authority');
        const status = urlParams.get('Status') || urlParams.get('status'); // ZarinPal: OK/NOK
        const trackId = urlParams.get('trackId') || urlParams.get('trans_id'); // NextPay/Others
        
        // Params from our App (passed in callback)
        const type = urlParams.get('type'); // 'order' or 'subscription'
        const orderId = urlParams.get('orderId');
        const plan = urlParams.get('plan'); // for subscription
        const sellerId = urlParams.get('sellerId');

        async function verify() {
            // 1. Initial Client-Side Check (Fast Fail)
            if (status === 'NOK') {
                showResult(false, 'پرداخت توسط کاربر لغو شد یا ناموفق بود.');
                return;
            }

            try {
                // 2. Call Edge Function for Secure Verification
                // Note: If Edge Function is not deployed, we will fallback to client-side logic for demo purposes.
                let verificationResult = null;
                
                try {
                    const { data, error } = await supabase.functions.invoke('verify-payment', {
                        body: { 
                            authority: authority || trackId,
                            amount: 0, // In a real scenario, the backend knows the amount from DB
                            type: type,
                            orderId: orderId,
                            plan: plan
                        }
                    });
                    
                    if (!error && data) {
                        verificationResult = data;
                    } else {
                        throw new Error("Edge Function Error");
                    }
                } catch (edgeError) {
                    console.warn("Edge Function failed, using client-side fallback (Not Recommended for Prod)", edgeError);
                    // --- FALLBACK LOGIC (Client Simulation) ---
                    // This is only safe if RLS policies allow the user to update their own order 'paid' status
                    // ideally, this should ONLY happen server-side.
                    verificationResult = await clientSideFallback();
                }

                if (verificationResult.success) {
                    showResult(true, 'تراکنش موفق', verificationResult);
                    fireConfetti();
                } else {
                    showResult(false, verificationResult.message || 'تراکنش تایید نشد');
                }

            } catch (err) {
                console.error(err);
                showResult(false, 'خطای سیستمی در تایید پرداخت');
            }
        }

        async function clientSideFallback() {
            // This is a simulation/fallback. In a real app, you MUST verify amount with gateway API.
            // Here we assume if 'Status' is OK, it's paid (Simple Mode).
            
            const refId = Math.floor(Math.random() * 1000000000);
            
            if (type === 'order' && orderId) {
                // Update Order
                const { error } = await supabase
                    .from('store_orders')
                    .update({ 
                        status: 'paid', 
                        payment_ref: refId,
                        updated_at: new Date()
                    })
                    .eq('id', orderId);
                
                if (error) return { success: false, message: 'خطا در ثبت سفارش' };
                
                // Fetch updated order for display
                const { data: order } = await supabase.from('store_orders').select('*').eq('id', orderId).single();
                return { 
                    success: true, 
                    amount: order.total_amount, 
                    refId: refId, 
                    date: new Date().toLocaleDateString('fa-IR'),
                    title: 'خرید محصول'
                };
            } 
            else if (type === 'subscription') {
                // Update Profile
                // Need current user ID
                const { data: { user } } = await supabase.auth.getUser();
                if (!user) return { success: false, message: 'کاربر شناسایی نشد' };

                const { error } = await supabase
                    .from('store_profiles')
                    .update({ 
                        plan_tier: plan,
                        subscription_end: new Date(Date.now() + 30*24*60*60*1000) // +30 days
                    })
                    .eq('user_id', user.id);

                if (error) return { success: false, message: 'خطا در فعال‌سازی اشتراک' };
                
                return { 
                    success: true, 
                    amount: plan === 'vip' ? 499000 : 199000, 
                    refId: refId, 
                    date: new Date().toLocaleDateString('fa-IR'),
                    title: `اشتراک ${plan.toUpperCase()}`
                };
            }
            
            return { success: false, message: 'نوع تراکنش نامعتبر است' };
        }

        function showResult(isSuccess, msg, data = {}) {
            document.getElementById('loader-view').classList.add('hidden');
            document.getElementById('result-view').classList.remove('hidden');
            
            const header = document.getElementById('status-header');
            const icon = document.getElementById('status-icon-i');
            const title = document.getElementById('status-title');
            const desc = document.getElementById('status-desc');
            const amountEl = document.getElementById('amount-val');
            
            if (isSuccess) {
                header.className = 'status-header success';
                icon.className = 'fas fa-check';
                title.innerText = 'پرداخت موفق';
                desc.innerText = msg;
                
                document.getElementById('ref-id').innerText = data.refId || '---';
                document.getElementById('date-val').innerText = data.date || new Date().toLocaleDateString('fa-IR');
                document.getElementById('order-type').innerText = data.title || (type === 'subscription' ? 'اشتراک ویژه' : 'سفارش محصول');
                amountEl.innerText = new Intl.NumberFormat('en-US').format(data.amount || 0);

                document.getElementById('btn-success-action').classList.remove('hidden');
                document.getElementById('btn-download').classList.remove('hidden');
            } else {
                header.className = 'status-header error';
                icon.className = 'fas fa-times';
                title.innerText = 'پرداخت ناموفق';
                desc.innerText = msg;
                amountEl.innerText = '0';
                
                document.getElementById('btn-retry').classList.remove('hidden');
            }
        }

        window.handleSuccessAction = () => {
            if (type === 'subscription') {
                window.location.href = 'index.html'; // Back to Dashboard
            } else {
                if (sellerId) {
                    window.location.href = `store.html?id=${sellerId}`; // Back to Store
                } else {
                    window.location.href = 'index.html'; // Fallback
                }
            }
        };

        window.downloadReceipt = () => {
            const el = document.getElementById('capture-area');
            html2canvas(el, { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Receipt-${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        };

        function fireConfetti() {
            var count = 200;
            var defaults = { origin: { y: 0.7 } };
            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, { particleCount: Math.floor(count * particleRatio) }));
            }
            fire(0.25, { spread: 26, startVelocity: 55 });
            fire(0.2, { spread: 60 });
            fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
            fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
            fire(0.1, { spread: 120, startVelocity: 45 });
        }

        verify();

    </script>
</body>
</html>
