<!DOCTYPE html>
<html lang="fa" dir="rtl" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff" id="meta-theme-color">
    <title>فروشگاه آنلاین | WebLegend Store</title>
    
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { 
                        brand: { 
                            primary: 'var(--brand-color)', 
                            glow: 'var(--brand-glow)',
                            dark: '#0f0f0f',
                            light: '#ffffff',
                            surface: '#f8f9fa',
                            darkSurface: '#1a1a1a'
                        } 
                    },
                    fontFamily: { sans: ['Vazirmatn', 'sans-serif'] },
                    animation: {
                        'enter': 'enter 0.6s cubic-bezier(0.2, 0.8, 0.2, 1)',
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-glow': 'pulseGlow 3s infinite',
                        'shimmer': 'shimmer 1.5s infinite linear',
                        'slide-up-modal': 'slideUpModal 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
                    },
                    keyframes: {
                        enter: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },
                        pulseGlow: { '0%, 100%': { boxShadow: '0 0 0 0 var(--brand-glow)' }, '70%': { boxShadow: '0 0 0 10px transparent' } },
                        shimmer: { '0%': { backgroundPosition: '-1000px 0' }, '100%': { backgroundPosition: '1000px 0' } },
                        slideUpModal: { '0%': { transform: 'translateY(100%)' }, '100%': { transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --brand-color: #D4AF37; 
            --brand-glow: rgba(212, 175, 55, 0.3);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        body { 
            background-color: #f9fafb;
            color: #1f2937; 
            -webkit-tap-highlight-color: transparent; 
            overflow-x: hidden; 
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        .dark body {
            background-color: #050505;
            color: #f3f4f6;
        }

        /* --- Hero Header --- */
        .hero-header {
            position: relative;
            background: #ffffff;
            padding-top: 2rem;    
            padding-bottom: 3rem; 
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            overflow: hidden;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }
        
        .dark .hero-header {
            background: #0f0f0f;
            box-shadow: 0 20px 50px -20px rgba(0,0,0,0.5);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .hero-pattern {
            position: absolute; inset: 0; opacity: 0.05;
            background-image: radial-gradient(#000 1px, transparent 1px);
            background-size: 20px 20px;
            mask-image: linear-gradient(to bottom, black, transparent);
        }
        .dark .hero-pattern {
            opacity: 0.2;
            background-image: radial-gradient(var(--brand-color) 1px, transparent 1px);
        }
        
        .hero-glow {
            position: absolute; top: -50%; left: 50%; transform: translateX(-50%);
            width: 120%; height: 120%;
            background: radial-gradient(circle, var(--brand-glow) 0%, transparent 70%);
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .dark .hero-glow { opacity: 0.4; }

        /* --- Avatar Story Ring --- */
        .story-ring {
            padding: 3px;
            background: transparent;
            border: 2px solid var(--brand-color);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--brand-glow);
        }

        /* --- Sticky Smart Bar --- */
        .smart-bar {
            position: sticky; top: 10px; z-index: 40;
            margin: 0 16px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0,0,0,0.05);
            border-radius: 16px;
            padding: 8px 8px;
            display: flex; flex-direction: column; gap: 8px;
            box-shadow: 0 4px 20px -5px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            transform: translateY(0);
        }
        .dark .smart-bar {
            background: rgba(30, 30, 30, 0.8);
            border-color: rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.3);
        }

        /* --- Product Card --- */
        .product-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            display: flex; flex-direction: column;
            border: 1px solid #f3f4f6;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }
        .dark .product-card {
            background: #151515;
            border-color: rgba(255,255,255,0.05);
        }
        .product-card:active { transform: scale(0.98); }
        
        .card-image-wrapper {
            position: relative; width: 100%; aspect-ratio: 1/1;
            background: #f9fafb; overflow: hidden;
        }
        .dark .card-image-wrapper { background: #1a1a1a; }
        
        .card-image {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.5s ease;
        }
        .product-card:hover .card-image { transform: scale(1.05); }

        .btn-buy {
            background: var(--brand-color);
            color: black;
            font-weight: 800;
            text-align: center;
            padding: 10px;
            border-radius: 12px;
            width: 100%;
            transition: all 0.2s;
            font-size: 12px;
            box-shadow: 0 4px 15px -3px var(--brand-glow);
        }
        
        /* --- Skeleton Loading --- */
        .skeleton {
            background: #f6f7f8;
            background-image: linear-gradient(to right, #f6f7f8 0%, #edeef1 20%, #f6f7f8 40%, #f6f7f8 100%);
            background-repeat: no-repeat;
            background-size: 1000px 100%; 
            animation: shimmer 1.5s infinite linear;
        }
        .dark .skeleton {
            background: #1a1a1a;
            background-image: linear-gradient(to right, #1a1a1a 0%, #222 20%, #1a1a1a 40%, #1a1a1a 100%);
        }

        /* --- Bottom Nav --- */
        .bottom-nav {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 12px 24px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 90;
            box-shadow: 0 10px 40px -5px rgba(0,0,0,0.1);
            border: 1px solid rgba(0,0,0,0.05);
        }
        .dark .bottom-nav {
            background: rgba(20, 20, 20, 0.9);
            box-shadow: 0 10px 40px -5px rgba(0,0,0,0.5);
            border-color: rgba(255,255,255,0.1);
        }
        .nav-item {
            color: #9ca3af; font-size: 20px;
            transition: all 0.3s; position: relative;
            display: flex; flex-direction: column; align-items: center;
        }
        .nav-item.active { color: var(--brand-color); transform: translateY(-3px); }

        /* --- AI Modal --- */
        .ai-modal {
            position: fixed; inset: 0; z-index: 200;
            background: #fff;
            display: flex; flex-direction: column;
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
        }
        .dark .ai-modal { background: #111; }
        .ai-modal.open { transform: translateY(0); }
        
        .ai-header {
            padding: 16px; border-bottom: 1px solid #f3f4f6;
            display: flex; justify-content: space-between; align-items: center;
            background: white;
        }
        .dark .ai-header { background: #151515; border-color: rgba(255,255,255,0.05); }
        
        .ai-body {
            flex: 1; overflow-y: auto; padding: 20px;
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex; flex-direction: column; justify-content: flex-end;
        }
        .dark .ai-body {
            background-image: radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px);
        }

        .ai-message {
            background: #f3f4f6; padding: 16px; border-radius: 20px; border-bottom-right-radius: 4px;
            max-width: 85%; margin-bottom: 20px; font-size: 13px; line-height: 1.6;
            color: #374151; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .dark .ai-message { background: #222; color: #e5e7eb; }

        .ai-suggestions {
            display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px;
            scrollbar-width: none;
        }
        .ai-chip {
            white-space: nowrap; padding: 10px 16px; border-radius: 16px;
            background: white; border: 1px solid #e5e7eb; color: #4b5563;
            font-size: 11px; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03); transition: all 0.2s;
        }
        .dark .ai-chip { background: #222; border-color: rgba(255,255,255,0.1); color: #ccc; }
        .ai-chip:active { transform: scale(0.95); }
        .ai-chip i { margin-left: 6px; color: var(--brand-color); }

        .ai-input-area {
            padding: 16px; border-top: 1px solid #f3f4f6; background: white;
            display: flex; gap: 10px; align-items: center; padding-bottom: max(16px, env(safe-area-inset-bottom));
        }
        .dark .ai-input-area { background: #151515; border-color: rgba(255,255,255,0.05); }

        /* --- Search Overlay --- */
        .search-overlay {
            position: fixed; inset: 0; background: rgba(255,255,255,0.98); z-index: 150;
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; flex-direction: column; padding: 20px;
        }
        .dark .search-overlay { background: rgba(10,10,10,0.98); }
        .search-overlay.open { transform: translateY(0); }

        .hide-scroll::-webkit-scrollbar { display: none; }
        
        /* --- Filters & Tags --- */
        .filter-chip {
            white-space: nowrap; padding: 6px 14px; border-radius: 12px;
            font-size: 10px; font-weight: 700; cursor: pointer; transition: all 0.2s;
            border: 1px solid transparent;
        }
        .filter-chip-active { background: #111; color: white; box-shadow: 0 4px 10px -2px rgba(0,0,0,0.3); }
        .filter-chip-inactive { background: white; border-color: #eee; color: #666; }
        .dark .filter-chip-active { background: white; color: black; }
        .dark .filter-chip-inactive { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); color: #999; }

    </style>
</head>
<body class="pb-32">

    <div id="ai-modal" class="ai-modal">
        <div class="ai-header">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-brand-primary to-yellow-300 flex items-center justify-center text-black shadow-lg">
                    <i class="fas fa-robot text-lg"></i>
                </div>
                <div>
                    <h3 class="font-black text-sm text-gray-900 dark:text-white">دستیار خرید</h3>
                    <p class="text-[10px] text-green-500 font-bold flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span> آنلاین و هوشمند</p>
                </div>
            </div>
            <button onclick="toggleAI()" class="w-8 h-8 rounded-full bg-gray-50 dark:bg-white/5 flex items-center justify-center text-gray-400 hover:text-red-500 transition"><i class="fas fa-chevron-down"></i></button>
        </div>
        
        <div class="ai-body">
            <div class="ai-message">
                سلام! 👋 <br>
                من دستیار هوشمند این فروشگاه هستم. <br>
                چطور می‌تونم بهت کمک کنم خرید لذت‌بخش‌تری داشته باشی؟
            </div>
            
            <div class="ai-suggestions">
                <button class="ai-chip" onclick="window.showToast('به زودی فعال می‌شود', 'info')"><i class="fas fa-gift"></i> پیشنهاد هدیه</button>
                <button class="ai-chip" onclick="window.filterCategory('cheapest')"><i class="fas fa-tag"></i> ارزان‌ترین‌ها</button>
                <button class="ai-chip" onclick="window.filterCategory('popular')"><i class="fas fa-star"></i> محبوب‌ترین‌ها</button>
            </div>
        </div>

        <div class="ai-input-area">
            <input type="text" placeholder="سوال خود را بپرسید..." class="flex-1 bg-gray-100 dark:bg-white/10 dark:text-white border-none rounded-xl px-4 py-3 text-sm font-medium outline-none focus:ring-2 focus:ring-brand-primary/50 transition">
            <button class="w-10 h-10 rounded-xl bg-brand-primary text-black flex items-center justify-center shadow-lg hover:scale-105 transition"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <div id="search-overlay" class="search-overlay">
        <div class="flex justify-between items-center mb-8">
            <h3 class="font-black text-2xl dark:text-white">جستجو</h3>
            <button onclick="toggleSearch()" class="w-10 h-10 rounded-full bg-gray-100 dark:bg-white/10 flex items-center justify-center hover:bg-red-50 dark:hover:bg-red-900/20 text-gray-500 dark:text-gray-300 hover:text-red-500 transition">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>
        <div class="relative mb-6">
            <i class="fas fa-search absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input type="text" id="overlay-search-input" placeholder="نام محصول را بنویسید..." class="w-full bg-gray-50 dark:bg-white/5 border-2 border-transparent focus:border-brand-primary rounded-2xl py-4 pr-12 pl-4 font-bold text-lg outline-none transition-all dark:text-white">
        </div>
        <div class="flex-1 overflow-y-auto" id="search-results">
            <div class="text-center text-gray-400 mt-10">
                <i class="fas fa-search text-4xl mb-4 opacity-20"></i>
                <p class="text-sm">چیزی تایپ کنید...</p>

        </div>
    </div>

    <header class="hero-header" id="main-header">

        <div class="absolute top-4 left-4 z-20">

        </button>
    </nav>

        // متغیرهای وضعیت

        let searchQuery = '';

        // --- UTILS ---
        const formatPrice = (n) => new Intl.NumberFormat('fa-IR').format(n);
        
        // تابع پارس ایمن (حیاتی)
        function safeParse(data, fallback = []) {
            if (!data) return fallback;
            if (typeof data === 'object') return data;
            try { return JSON.parse(data); } catch (e) { return fallback; }
        }

        window.showToast = (msg, type = 'success') => {
            Toastify({
                text: msg, duration: 3000, gravity: "top", position: "center",
                style: {
                    background: type === 'success' ? "#10B981" : (type === 'error' ? "#EF4444" : "#F59E0B"),
                    borderRadius: "12px", fontFamily: "Vazirmatn", fontWeight: "bold"
                }
            }).showToast();
        };

        // --- INTERACTION FUNCTIONS (Connected to Window) ---
        window.toggleSearch = () => {
            document.getElementById('search-overlay').classList.toggle('open');
            if(document.getElementById('search-overlay').classList.contains('open')) {
                setTimeout(() => document.getElementById('overlay-search-input').focus(), 100);
            }
        };

        window.toggleAI = () => {
            document.getElementById('ai-modal').classList.toggle('open');
        };

        window.toggleTheme = () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
        };
        // این تابع را به اسکریپت‌های store.html اضافه کنید
window.goToCustomerPanel = () => {
    // 1. گرفتن شناسه فروشنده از لینک فعلی
    const urlParams = new URLSearchParams(window.location.search);
    const sellerId = urlParams.get('id');

    if (sellerId) {
        // 2. هدایت به پنل مشتری با حفظ شناسه فروشنده
        window.location.href = `customer.html?id=${sellerId}`;
    } else {
        window.showToast('شناسه فروشگاه یافت نشد', 'error');
    }
};

        // --- INIT ---
        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        async function init() {
            initTheme();
            
            const urlParams = new URLSearchParams(window.location.search);
            const sellerId = urlParams.get('id');

            if (!sellerId) {
                document.body.innerHTML = `
                    <div class="flex flex-col items-center justify-center min-h-screen bg-gray-50 dark:bg-[#0a0a0a] text-center p-4">
                        <i class="fas fa-store-slash text-6xl text-gray-300 mb-4"></i>
                        <h1 class="text-xl font-bold text-gray-700 dark:text-gray-200">فروشگاه یافت نشد</h1>
                        <p class="text-gray-500 mt-2 text-sm">لطفاً از لینک صحیح فروشگاه استفاده کنید.</p>
                    </div>`;
                return;
            }

            await loadSellerProfile(sellerId);
            await loadProducts(sellerId);
            setupFilters();
        }

        // --- BRANDING ---
        async function loadSellerProfile(sellerId) {
            try {
                const { data, error } = await supabase
                    .from('store_profiles')
                    .select('*')
                    .eq('user_id', sellerId)
                    .single();

                if (data) {
                    sellerProfile = data;
                    document.title = data.shop_name || 'فروشگاه آنلاین';
                    
                    document.querySelectorAll('.store-name-target').forEach(el => el.innerText = data.shop_name || 'فروشگاه من');
                    const bioEl = document.getElementById('store-bio');
                    if(bioEl) bioEl.innerText = data.bio || 'به فروشگاه ما خوش آمدید';

                    if (data.avatar_url) {
                        document.querySelectorAll('.store-logo-target').forEach(img => img.src = data.avatar_url);
                        // Favicon
                        let link = document.querySelector("link[rel~='icon']");
                        if (!link) {
                            link = document.createElement('link');
                            link.rel = 'icon';
                            document.getElementsByTagName('head')[0].appendChild(link);
                        }
                        link.href = data.avatar_url;
                    }

                    if (data.brand_color) {
                        document.documentElement.style.setProperty('--brand-color', data.brand_color);
                        document.documentElement.style.setProperty('--brand-glow', data.brand_color + '40');
                    }
                    
                    if(data.instagram_id) {
                        const instaBtn = document.getElementById('btn-instagram');
                        if(instaBtn) {
                            instaBtn.href = `https://instagram.com/${data.instagram_id}`;
                            instaBtn.classList.remove('hidden');
                        }
                    }
                }
            } catch (err) {
                console.error('Error loading profile:', err);
            }
        }

        // --- PRODUCTS ---
        async function loadProducts(sellerId) {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '<div class="col-span-full text-center py-20 text-gray-400 animate-pulse"><i class="fas fa-circle-notch fa-spin text-3xl mb-3"></i><p>در حال چیدمان ویترین...</p></div>';

            try {
                const { data, error } = await supabase
                    .from('store_products')
                    .select('*')
                    .eq('seller_id', sellerId)
                    .eq('is_active', true)
                    .order('created_at', { ascending: false });

                if (error) throw error;
                allProducts = data || [];

                document.getElementById('product-count').innerText = allProducts.length + ' محصول';
                renderCategories();
                renderProducts();

            } catch (err) {
                console.error(err);
                grid.innerHTML = `
                    <div class="col-span-full text-center py-10 text-red-400">
                        <i class="fas fa-exclamation-triangle mb-2 text-2xl"></i>
                        <p>ارتباط با سرور برقرار نشد.</p>
                        <button onclick="location.reload()" class="mt-4 px-4 py-2 bg-red-500 text-white rounded-lg text-xs font-bold">تلاش مجدد</button>
                    </div>`;
            }
        }

        // --- CATEGORIES & FILTERS ---
        function renderCategories() {
            const container = document.getElementById('category-pills');
            if (!container) return;

            const categories = new Set(['all']);
            allProducts.forEach(p => {
                if(p.category) categories.add(p.category);
            });

            container.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                const isActive = cat === 'all';
                btn.className = `filter-chip whitespace-nowrap px-4 py-2 rounded-full text-xs font-bold transition-all border ${isActive ? 'filter-chip-active bg-brand-primary text-white border-brand-primary' : 'filter-chip-inactive bg-white dark:bg-white/5 text-gray-600 dark:text-gray-300 border-gray-200 dark:border-white/10 hover:border-brand-primary'}`;
                btn.innerText = cat === 'all' ? 'همه محصولات' : cat;
                btn.onclick = () => window.filterCategory(cat, btn);
                container.appendChild(btn);
            });
        }

        window.filterCategory = (cat, btn = null) => {
            if(cat === 'cheapest' || cat === 'expensive' || cat === 'popular') {
                // Sorting logic
                let sorted = [...allProducts];
                if(cat === 'cheapest') sorted.sort((a,b) => a.price - b.price);
                if(cat === 'expensive') sorted.sort((a,b) => b.price - a.price);
                // For popular, we need sales data, for now we shuffle or use price
                
                // Update UI for sort buttons
                document.querySelectorAll('#smart-bar > div:first-child .filter-chip').forEach(el => {
                    el.classList.remove('filter-chip-active', 'bg-brand-primary', 'text-white');
                    el.classList.add('filter-chip-inactive');
                });
                const activeBtn = document.getElementById(`btn-filter-${cat}`);
                if(activeBtn) {
                    activeBtn.classList.remove('filter-chip-inactive');
                    activeBtn.classList.add('filter-chip-active', 'bg-brand-primary', 'text-white');
                }
                
                renderProducts(sorted);
                return;
            }

            // Normal Category Filter
            currentCategory = cat;
            
            // Update Category Pills UI
            const container = document.getElementById('category-pills');
            Array.from(container.children).forEach(el => {
                el.classList.remove('filter-chip-active', 'bg-brand-primary', 'text-white', 'border-brand-primary');
                el.classList.add('filter-chip-inactive', 'bg-white', 'dark:bg-white/5', 'text-gray-600', 'dark:text-gray-300', 'border-gray-200', 'dark:border-white/10');
            });
            
            if(btn) {
                btn.classList.remove('filter-chip-inactive', 'bg-white', 'dark:bg-white/5', 'text-gray-600', 'dark:text-gray-300', 'border-gray-200', 'dark:border-white/10');
                btn.classList.add('filter-chip-active', 'bg-brand-primary', 'text-white', 'border-brand-primary');
            } else {
                // If called without btn (e.g. reset), select 'all'
                if(container.firstChild) {
                     container.firstChild.classList.add('filter-chip-active', 'bg-brand-primary', 'text-white', 'border-brand-primary');
                }
            }

            renderProducts();
        };

        function setupFilters() {
            const searchInput = document.getElementById('search-input'); // Header search
            const overlaySearch = document.getElementById('overlay-search-input'); // Overlay search
            
            const handleSearch = (e) => {
                searchQuery = e.target.value.toLowerCase();
                renderProducts();
            };

            if(searchInput) searchInput.addEventListener('input', handleSearch);
            if(overlaySearch) overlaySearch.addEventListener('input', handleSearch);
        }

        function renderProducts(sourceList = allProducts) {
            const grid = document.getElementById('products-grid');
            
            const filtered = sourceList.filter(p => {
                const matchCat = currentCategory === 'all' || p.category === currentCategory;
                const matchSearch = !searchQuery || p.title.toLowerCase().includes(searchQuery);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '';
                document.getElementById('empty-state').classList.remove('hidden');
                return;
            }
            
            document.getElementById('empty-state').classList.add('hidden');
            grid.innerHTML = '';
            
            filtered.forEach(p => {
                // Image handling (JSONB Safe)
                const images = safeParse(p.image_url);
                let imgUrl = (images.length > 0) ? images[0] : 'img/logo01.png';
                if(typeof p.image_url === 'string' && p.image_url.startsWith('http')) imgUrl = p.image_url;

                // Discount Logic
                const discount = safeParse(p.discount_info);
                let priceHtml = '';
                let badgeHtml = '';

                if (discount && discount.active && discount.percent > 0) {
                    const finalPrice = p.price * (100 - discount.percent) / 100;
                    priceHtml = `
                        <div class="flex flex-col items-end">
                             <span class="text-[10px] text-gray-400 line-through decoration-red-500">${formatPrice(p.price)}</span>
                             <span class="text-sm font-black text-brand-primary">${formatPrice(finalPrice)} <span class="text-[9px] font-normal text-gray-500">تومان</span></span>
                        </div>`;
                    badgeHtml += `<span class="absolute top-2 left-2 bg-red-500 text-white text-[9px] font-bold px-2 py-1 rounded-full shadow-sm z-10">${discount.percent}%</span>`;
                } else {
                    priceHtml = `<span class="text-sm font-black text-brand-primary">${formatPrice(p.price)} <span class="text-[9px] font-normal text-gray-500">تومان</span></span>`;
                }

                if(p.type === 'digital') {
                    badgeHtml += `<span class="absolute top-2 right-2 bg-black/60 backdrop-blur text-white text-[9px] px-2 py-1 rounded-lg"><i class="fas fa-cloud-download-alt text-brand-primary"></i></span>`;
                }

                // Stock Logic
                let stockOverlay = '';
                if(p.stock_quantity <= 0) {
                    stockOverlay = '<div class="absolute inset-0 bg-white/80 dark:bg-black/80 backdrop-blur-[2px] flex items-center justify-center z-20"><span class="bg-black text-white px-3 py-1 rounded-lg text-xs font-bold">ناموجود</span></div>';
                }

                const card = document.createElement('div');
                card.className = "group relative bg-white dark:bg-[#151515] rounded-2xl overflow-hidden border border-gray-100 dark:border-white/5 hover:border-brand-primary/50 transition-all hover:shadow-lg hover:shadow-brand-primary/10";
                
                card.innerHTML = `
                    <a href="sale.html?id=${p.id}" class="block">
                        <div class="relative w-full aspect-square bg-gray-50 dark:bg-white/5 overflow-hidden">
                            ${badgeHtml}
                            ${stockOverlay}
                            <img src="${imgUrl}" alt="${p.title}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                        </div>
                        
                        <div class="p-4">
                            <h3 class="font-bold text-gray-800 dark:text-gray-100 text-sm mb-1 line-clamp-1 group-hover:text-brand-primary transition-colors">${p.title}</h3>
                            ${p.short_description ? `<p class="text-[10px] text-gray-500 line-clamp-1 mb-3">${p.short_description}</p>` : '<div class="h-4 mb-3"></div>'}
                            
                            <div class="flex items-center justify-between border-t border-gray-100 dark:border-white/5 pt-3">
                                ${priceHtml}
                                <span class="w-8 h-8 rounded-xl bg-black text-white flex items-center justify-center shadow-lg group-hover:bg-brand-primary group-hover:text-black transition-colors"><i class="fas fa-plus"></i></span>
                            </div>
                        </div>
                    </a>
                `;
                grid.appendChild(card);
            });
        }

        window.resetFilters = () => {
             currentCategory = 'all';
             searchQuery = '';
             const input = document.getElementById('overlay-search-input');
             if(input) input.value = '';
             
             // Reset UI
             document.querySelectorAll('#smart-bar .filter-chip').forEach(el => {
                 el.classList.remove('filter-chip-active', 'bg-brand-primary', 'text-white');
                 el.classList.add('filter-chip-inactive');
             });
             document.getElementById('btn-filter-all').classList.add('filter-chip-active');
             
             renderCategories(); // Re-render pills to reset selection
             renderProducts(allProducts);
        };

        window.shareStore = () => {
            if (navigator.share) {
                navigator.share({ title: document.title, url: window.location.href });
            } else {
                navigator.clipboard.writeText(window.location.href);
                window.showToast('لینک فروشگاه کپی شد', 'success');
            }
        };

        // شروع برنامه
        init();
    </script>
</body>
</html>
